[project]
name = "customer-behavior-modeling-for-ecommerce"
version = "0.1.0"
description = "Spark feature engineering for ecommerce customer behavior"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

